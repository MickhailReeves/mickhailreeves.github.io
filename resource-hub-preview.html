<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resource Hub — Interactive Preview</title>
<style>
  :root{
    --blue-800:#123ea8;
    --blue-700:#1a4fd1;
    --blue-600:#2265e8;
    --blue-500:#3b82f6;
    --blue-100:#dbeafe;
    --blue-50:#eaf1ff;
    --ink-900:#16233f;
    --ink-700:#374967;
    --ink-500:#6b7794;
    --grey-100:#f2f4f8;
    --grey-200:#e5e9f1;
    --white:#ffffff;
    --amber-500:#f6b21b;
    --radius-lg:16px;
    --radius-md:12px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background:var(--grey-100);
    color:var(--ink-900);
    display:flex;
    min-height:600px;
    overflow:hidden;
  }
  svg.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block;}

  /* SIDEBAR */
  .sidebar{
    width:230px;
    flex-shrink:0;
    background:linear-gradient(160deg,var(--blue-800) 0%, var(--blue-600) 60%, var(--blue-500) 100%);
    padding:22px 16px;
    color:#fff;
    overflow-y:auto;
  }
  .brand{
    width:68px;height:68px;border-radius:50%;
    background:var(--amber-500);
    display:flex;align-items:center;justify-content:center;
    margin-bottom:22px; overflow:hidden;
  }
  .brand svg{width:34px;height:34px;stroke:#16233f;stroke-width:1.6;}
  .nav-section-label{
    font-size:11px;letter-spacing:.06em;font-weight:700;
    color:rgba(255,255,255,.8);
    margin:18px 10px 8px;
  }
  .nav-item{
    display:flex;align-items:center;gap:10px;
    padding:9px 10px;border-radius:24px;
    color:#fff;font-size:14px;font-weight:700;
    cursor:pointer;margin-bottom:4px;
    border:none;background:transparent;width:100%;text-align:left;
    transition:background .15s ease, color .15s ease;
  }
  .nav-item .ic-wrap{
    width:28px;height:28px;border-radius:50%;
    background:rgba(255,255,255,.16);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0; color:#fff;
  }
  .nav-item .ic-wrap svg{width:16px;height:16px;stroke-width:2;}
  .nav-item:hover{background:rgba(255,255,255,.12);}
  .nav-item.active{background:#fff;color:var(--blue-700);}
  .nav-item.active .ic-wrap{background:var(--blue-50);color:var(--blue-700);}
  .nav-divider{height:1px;background:rgba(255,255,255,.28);margin:14px 6px;}

  /* MAIN */
  .main{flex:1;display:flex;flex-direction:column;min-width:0;}
  .topbar{
    display:flex;align-items:center;gap:14px;
    padding:14px 26px;border-bottom:1px solid var(--grey-200);
    background:#fff;flex-shrink:0;
  }
  .search{
    flex:1;background:var(--grey-100);border-radius:24px;
    padding:9px 16px;font-size:13px;color:var(--ink-500);
    display:flex;align-items:center;gap:8px;border:1px solid var(--grey-200);
  }
  .search svg{color:var(--ink-500);width:16px;height:16px;flex-shrink:0;}
  .search .chat-ic{margin-left:auto;color:var(--blue-600);width:18px;height:18px;}
  .pill{
    background:transparent;color:var(--ink-500);font-size:12.5px;font-weight:700;
    white-space:nowrap;
  }
  .a11y-pill{
    background:var(--blue-600);color:#fff;font-size:12px;font-weight:700;
    padding:7px 14px;border-radius:20px;display:flex;align-items:center;gap:6px;white-space:nowrap;
  }
  .a11y-pill svg{width:14px;height:14px;}
  .top-meta{font-size:12.5px;font-weight:700;color:var(--blue-700);white-space:nowrap;cursor:default;}
  .bell-wrap{position:relative;color:var(--ink-700);}
  .bell-dot{position:absolute;top:-3px;right:-3px;width:8px;height:8px;background:var(--blue-600);border-radius:50%;border:2px solid #fff;}
  .avatar{
    width:30px;height:30px;border-radius:50%;background:var(--blue-700);
    color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;
    cursor:pointer;
  }
  .jd-name{font-weight:800;font-size:13px;color:var(--ink-900);cursor:pointer;}

  .content{flex:1;overflow-y:auto;padding:26px 30px;}
  .crumb{font-size:13px;color:var(--ink-500);margin-bottom:10px;font-weight:600;}
  .crumb b{color:var(--blue-600);}
  .page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;}
  h1.page-title{font-size:32px;margin:0 0 8px;color:var(--ink-900);font-weight:800;}
  p.page-sub{font-size:14.5px;color:var(--ink-700);margin:0 0 22px;max-width:640px;line-height:1.5;}
  .head-glyph{color:var(--blue-600);flex-shrink:0;position:relative;}
  .head-glyph svg{width:70px;height:70px;stroke-width:1.4;}
  .sparkle{position:absolute;color:var(--blue-300,#93b8fb);}

  .card{
    background:#fff;border-radius:var(--radius-lg);
    border:1px solid var(--grey-200);
    box-shadow:0 1px 3px rgba(15,31,61,.05);
  }

  /* two-column layout with side rail */
  .layout-row{display:grid;grid-template-columns:1fr 300px;gap:20px;align-items:start;}
  @media(max-width:900px){.layout-row{grid-template-columns:1fr;}}
  .side-rail{
    background:linear-gradient(160deg,var(--blue-700), var(--blue-500));
    border-radius:var(--radius-lg);color:#fff;padding:20px;
  }
  .side-rail h4{margin:0 0 14px;font-size:16px;font-weight:800;}
  .rail-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.22);}
  .rail-item:last-child{border-bottom:none;}
  .rail-item .ic-wrap{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .rail-item .ic-wrap svg{width:16px;height:16px;}
  .rail-item .t{font-weight:800;font-size:13.5px;margin-bottom:2px;}
  .rail-item .d{font-size:12px;color:rgba(255,255,255,.85);line-height:1.5;}
  .rail-item .d a{color:#fff;font-weight:700;}
  .lock-note{margin-top:16px;display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid var(--grey-200);border-radius:var(--radius-md);padding:14px;font-size:12px;color:var(--ink-700);line-height:1.5;}
  .lock-note svg{color:var(--blue-600);width:20px;height:20px;flex-shrink:0;}

  /* stepper header */
  .steps-row{
    display:flex;align-items:center;gap:10px;
    padding:18px 24px;border-bottom:1px solid var(--grey-200);
    flex-wrap:wrap;
  }
  .step{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-500);font-weight:700;}
  .step .dot{
    width:23px;height:23px;border-radius:50%;background:var(--grey-200);color:var(--ink-500);
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0;
  }
  .step.active{color:var(--blue-700);}
  .step.active .dot{background:var(--blue-700);color:#fff;}
  .step.done .dot{background:var(--blue-700);color:#fff;}
  .step-line{flex:1;height:2px;background:var(--grey-200);min-width:20px;}

  .step-body{padding:22px 24px;}
  .step-body h3{margin:0 0 4px;font-size:17px;font-weight:800;}
  .step-body .hint{font-size:13.5px;color:var(--ink-500);margin:0 0 16px;}

  /* symptom grid */
  .sym-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px;}
  @media(max-width:820px){.sym-grid{grid-template-columns:repeat(2,1fr);}}
  .sym-tile{
    border:1.5px solid var(--grey-200);border-radius:var(--radius-md);
    padding:16px 10px;text-align:center;cursor:pointer;
    transition:border-color .15s, background .15s, transform .1s;
    background:#fff;
  }
  .sym-tile:hover{border-color:var(--blue-500);transform:translateY(-1px);}
  .sym-tile.selected{border-color:var(--blue-700);background:var(--blue-50);}
  .sym-tile .glyph{
    width:46px;height:46px;border-radius:50%;background:var(--blue-50);color:var(--blue-700);
    display:flex;align-items:center;justify-content:center;margin:0 auto 8px;
  }
  .sym-tile.selected .glyph{background:var(--blue-100);}
  .sym-tile .lbl{font-size:13px;font-weight:700;color:var(--ink-900);}

  .choice-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;}
  .choice{
    border:1.5px solid var(--grey-200);border-radius:24px;padding:9px 18px;
    font-size:13px;font-weight:700;cursor:pointer;color:var(--ink-700);background:#fff;
    transition:all .15s; display:flex;flex-direction:column;align-items:center;gap:6px;
  }
  .choice:hover{border-color:var(--blue-500);}
  .choice.selected{background:var(--blue-700);border-color:var(--blue-700);color:#fff;}

  .q-block{margin-bottom:20px;}
  .q-block .q-title{font-weight:800;font-size:14px;margin-bottom:10px;}
  textarea.freeform{
    width:100%;border:1.5px solid var(--grey-200);border-radius:var(--radius-md);
    padding:12px;font-size:13px;font-family:inherit;resize:vertical;min-height:70px;
  }

  .disclaimer{
    display:flex;gap:10px;align-items:flex-start;background:var(--grey-100);
    border-radius:var(--radius-md);padding:12px 16px;font-size:12.5px;color:var(--ink-700);
    margin-bottom:16px;line-height:1.5;
  }
  .disclaimer svg{color:var(--blue-600);width:18px;height:18px;flex-shrink:0;}
  .step-footer{display:flex;justify-content:flex-end;gap:10px;align-items:center;}
  .btn{
    border:none;border-radius:24px;padding:13px 26px;font-size:14.5px;font-weight:800;
    cursor:pointer;transition:filter .15s, transform .1s;
  }
  .btn:active{transform:scale(.98);}
  .btn-primary{background:var(--blue-700);color:#fff;}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-primary:disabled{background:var(--grey-200);color:var(--ink-500);cursor:not-allowed;}
  .btn-ghost{background:transparent;color:var(--blue-700);}
  .btn-outline-white{background:#fff;border:1.5px solid var(--ink-900);color:var(--ink-900);}

  .emergency-banner{
    margin-top:20px;background:var(--amber-500);
    border-radius:var(--radius-lg);padding:18px 22px;
    display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  }
  .emergency-banner .t{font-weight:800;font-size:15px;color:var(--ink-900);margin-bottom:4px;}
  .emergency-banner .d{font-size:12.5px;color:var(--ink-900);max-width:420px;line-height:1.4;}

  /* results */
  .results-grid{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:20px;padding:22px 24px;border-bottom:1px solid var(--grey-200);}
  @media(max-width:820px){.results-grid{grid-template-columns:1fr;}}
  .cause-box{border:1.5px solid var(--grey-200);border-radius:var(--radius-md);padding:16px;display:flex;gap:12px;align-items:center;}
  .cause-box .glyph{width:46px;height:46px;border-radius:50%;background:var(--blue-50);color:var(--blue-700);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .cause-box .name{font-size:18px;font-weight:800;}
  .cause-box .sub{font-size:12px;color:var(--ink-500);margin-top:2px;}
  .conf-wrap{text-align:center;}
  .conf-ring{width:78px;height:78px;margin:0 auto 6px;border-radius:50%;
    background:conic-gradient(var(--blue-700) 0% 72%, var(--grey-200) 72% 100%);
    display:flex;align-items:center;justify-content:center;}
  .conf-ring .inner{width:58px;height:58px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;color:var(--blue-700);}
  .compare-bar{height:8px;border-radius:6px;background:var(--grey-200);margin:6px 0 10px;position:relative;overflow:hidden;}
  .compare-bar .fill{height:100%;border-radius:6px;background:var(--blue-700);}
  .compare-row{font-size:12px;font-weight:700;color:var(--ink-700);margin-bottom:2px;}

  .advice-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:22px 24px;}
  @media(max-width:820px){.advice-grid{grid-template-columns:1fr;}}
  .advice-item{display:flex;gap:12px;margin-bottom:16px;}
  .advice-item .glyph{width:38px;height:38px;border-radius:50%;background:var(--blue-50);color:var(--blue-700);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .advice-item .t{font-weight:800;font-size:14px;margin-bottom:2px;}
  .advice-item .d{font-size:12.5px;color:var(--ink-500);line-height:1.5;}
  .advice-text{font-size:13.5px;color:var(--ink-700);line-height:1.6;}
  .advice-text b{color:var(--ink-900);}
  .link{color:var(--blue-700);font-weight:800;font-size:13px;text-decoration:underline;cursor:pointer;}

  /* profile */
  .profile-hero{display:flex;align-items:center;gap:18px;padding:22px 24px;border-bottom:1px solid var(--grey-200);}
  .p-avatar{width:64px;height:64px;border-radius:50%;background:var(--blue-50);color:var(--blue-700);display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative;}
  .p-avatar svg{width:30px;height:30px;}
  .p-name{font-size:22px;font-weight:800;}
  .p-meta{font-size:13px;color:var(--ink-500);margin-top:2px;}
  .profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:20px 24px;}
  @media(max-width:820px){.profile-grid{grid-template-columns:1fr;}}
  .info-card{border:1px solid var(--grey-200);border-radius:var(--radius-md);padding:16px;}
  .info-card h4{margin:0 0 12px;font-size:14.5px;display:flex;align-items:center;gap:8px;font-weight:800;}
  .info-card h4 svg{color:var(--blue-700);width:18px;height:18px;}
  .info-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--grey-100);font-size:13px;}
  .info-row:last-child{border-bottom:none;}
  .info-row .k{display:flex;align-items:center;gap:8px;color:var(--ink-700);font-weight:700;}
  .info-row .k svg{width:16px;height:16px;color:var(--ink-500);}
  .info-row .v{color:var(--ink-500);text-align:right;}

  .home-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
  @media(max-width:820px){.home-grid{grid-template-columns:1fr;}}
  .home-card{
    background:#fff;border:1px solid var(--grey-200);border-radius:var(--radius-lg);
    padding:20px;cursor:pointer;transition:transform .15s, box-shadow .15s;
  }
  .home-card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(15,31,61,.08);}
  .home-card .glyph{width:46px;height:46px;border-radius:50%;background:var(--blue-50);color:var(--blue-700);display:flex;align-items:center;justify-content:center;margin-bottom:12px;}
  .home-card .t{font-weight:800;font-size:15px;margin-bottom:4px;}
  .home-card .d{font-size:12.5px;color:var(--ink-500);line-height:1.5;}

  .fade-in{animation:fadeIn .25s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

  /* ============ HOME / LANDING VIEW ============ */
  #home-view{height:100%;overflow-y:auto;background:var(--grey-100);}
  .hv-hero{
    background:linear-gradient(120deg,#1c4fd8 0%, #3376f0 45%, #5aa0fb 100%);
    padding:22px 40px 34px;color:#fff;
  }
  .hv-topbar{display:flex;align-items:center;gap:20px;margin-bottom:34px;}
  .hv-burger{color:#fff;cursor:pointer;flex-shrink:0;}
  .hv-burger svg{width:24px;height:24px;stroke-width:2;}
  .hv-search{
    flex:1;max-width:520px;background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.55);
    border-radius:24px;padding:10px 18px;font-size:13.5px;color:rgba(255,255,255,.85);
    display:flex;align-items:center;gap:10px;
  }
  .hv-search svg{width:16px;height:16px;color:rgba(255,255,255,.85);flex-shrink:0;}
  .hv-navlinks{display:flex;align-items:center;gap:26px;margin-left:auto;white-space:nowrap;}
  .hv-navlinks .nl{color:#fff;font-weight:800;font-size:14px;letter-spacing:.02em;cursor:pointer;}
  .hv-bell{position:relative;color:#fff;background:rgba(255,255,255,.18);width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .hv-bell svg{width:16px;height:16px;}
  .hv-avatar{width:34px;height:34px;border-radius:50%;background:var(--blue-800);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0;}
  .hv-username{font-weight:800;font-size:14px;white-space:nowrap;}

  .hv-eyebrow{font-size:26px;font-weight:400;margin:0 0 2px;}
  .hv-headline{font-size:46px;font-weight:800;margin:0 0 14px;line-height:1.1;}
  .hv-sub{font-size:18px;font-weight:400;color:rgba(255,255,255,.95);margin:0 0 26px;max-width:680px;line-height:1.4;}
  .hv-cta-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
  .hv-btn-primary{background:var(--amber-500);color:var(--ink-900);border:none;border-radius:26px;padding:14px 30px;font-size:16px;font-weight:800;cursor:pointer;}
  .hv-btn-outline{background:transparent;color:#fff;border:2px solid #fff;border-radius:26px;padding:13px 30px;font-size:16px;font-weight:800;cursor:pointer;}
  .hv-cta-spacer{flex:1;}
  .hv-ai{display:flex;align-items:center;gap:10px;}
  .hv-ai-icon{width:38px;height:38px;border-radius:50%;background:#fff;color:var(--blue-700);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .hv-ai-icon svg{width:18px;height:18px;}
  .hv-ai-label{font-weight:700;font-size:14.5px;}
  .hv-a11y{background:rgba(255,255,255,.9);color:var(--ink-900);font-size:12px;font-weight:700;padding:7px 14px;border-radius:16px;margin-left:-6px;}

  .hv-body{padding:36px 40px 50px;}
  .hv-body h2{font-size:28px;font-weight:800;color:var(--ink-900);margin:0 0 4px;}
  .hv-body .lead{font-size:15px;color:var(--ink-700);margin:0 0 22px;}

  .hv-begin-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:32px;}
  @media(max-width:760px){.hv-begin-grid{grid-template-columns:1fr;}}
  .hv-begin-card{
    border-radius:20px;padding:20px 22px;display:flex;gap:16px;align-items:flex-start;cursor:pointer;
    transition:transform .15s;
  }
  .hv-begin-card:hover{transform:translateY(-2px);}
  .hv-begin-card.dark{background:var(--blue-700);color:#fff;}
  .hv-begin-card.light{background:var(--blue-100);color:var(--ink-900);}
  .hv-begin-card .ic-circle{width:42px;height:42px;border-radius:50%;background:#fff;color:var(--blue-700);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .hv-begin-card .ic-circle svg{width:20px;height:20px;}
  .hv-begin-card .t{font-weight:800;font-size:17px;text-decoration:underline;margin-bottom:4px;}
  .hv-begin-card.dark .d{color:rgba(255,255,255,.92);font-size:13.5px;line-height:1.45;}
  .hv-begin-card.light .d{color:var(--ink-700);font-size:13.5px;line-height:1.45;}

  .hv-explore-box{border:1px solid var(--grey-200);border-radius:20px;padding:24px 26px;background:#fff;margin-bottom:28px;}
  .hv-explore-box h3{font-size:24px;font-weight:800;margin:0 0 2px;color:var(--ink-900);}
  .hv-explore-box .lead{margin-bottom:18px;}
  .hv-topic-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
  @media(max-width:760px){.hv-topic-row{grid-template-columns:repeat(2,1fr);}}
  .hv-topic{border:1.5px solid var(--blue-700);border-radius:14px;padding:18px 10px;text-align:center;cursor:pointer;transition:background .15s;}
  .hv-topic:hover{background:var(--blue-50);}
  .hv-topic .glyph{width:44px;height:44px;border-radius:50%;background:var(--blue-50);color:var(--blue-700);display:flex;align-items:center;justify-content:center;margin:0 auto 10px;}
  .hv-topic .lbl{font-weight:700;font-size:14px;color:var(--ink-900);}

  .hv-bottom-row{display:grid;grid-template-columns:1.3fr 1fr 1.2fr auto;gap:0;border:1px solid var(--grey-200);border-radius:16px;background:#fff;overflow:hidden;margin-bottom:24px;}
  @media(max-width:900px){.hv-bottom-row{grid-template-columns:1fr;}}
  .hv-bottom-col{padding:20px 22px;border-right:1px solid var(--grey-200);}
  .hv-bottom-col:last-child{border-right:none;}
  .hv-doc-row{display:flex;gap:12px;align-items:center;margin-bottom:12px;}

});

function stepsRowHTML(steps, current){
  return `<div class="steps-row">` + steps.map((s,i)=>{
    const cls = s.n===current ? 'active' : (s.n<current ? 'done' : '');
    const dotContent = s.n<current ? '✓' : s.n;
    const line = i<steps.length-1 ? '<div class="step-line"></div>' : '';
    return `<div class="step ${cls}"><div class="dot">${dotContent}</div>${s.label}</div>${line}`;
  }).join('') + `</div>`;
}

function route(key){
  if(key==='home'){
    document.getElementById('app-shell').style.display='none';
    document.getElementById('home-view').style.display='block';
    return;
  }
  document.getElementById('home-view').style.display='none';
  document.getElementById('app-shell').style.display='flex';
  setActiveNav(key);
  if(key==='symptom') return renderSymptomChecker();
  if(key==='newcontacts') return renderNewToContacts();
  if(key==='profile') return renderProfile();
  if(key==='find') return renderFindDoctor();
  if(key==='doctor') return renderContactDoctor();
  if(key==='faq') return renderCareTipsFaq();
  if(key==='emergency') return renderEmergency();
  if(key==='message') return renderMessageDoctor();
  if(key==='book') return renderBookAppointment();
  if(key==='lensguide') return renderLensGuide();
  return renderPlaceholder(document.querySelector(`.nav-item[data-nav="${key}"]`)?.textContent.trim() || key);
}

function toggleSet(set, val){ set.has(val) ? set.delete(val) : set.add(val); }

function renderSymStep(){
  const card = document.getElementById('sym-card');
  if(symState.step===1){
    const tiles = [
      ['Dryness','droplet'],['Redness','eye'],['Irritation','waves'],['Watering','eyeWater'],
      ['Blurred vision','blur'],['Sensitivity to light','sun'],['Discomfort','bolt'],['Something else','chatDots']
    ];
    card.innerHTML = `
      ${stepsRowHTML(symSteps,1)}
      <div class="step-body fade-in">
        <h3>What are you experiencing?</h3>
        <p class="hint">Select all that apply.</p>
        <div class="sym-grid">
          ${tiles.map(([label,g])=>`
            <div class="sym-tile ${symState.symptoms.has(label)?'selected':''}" data-val="${label}">
              <div class="glyph">${ic(g)}</div>
              <div class="lbl">${label}</div>
            </div>`).join('')}
        </div>
        ${disclaimerHTML()}
        <div class="step-footer">
          <button class="btn btn-primary" id="sym-continue" ${symState.symptoms.size===0?'disabled':''}>Continue</button>
        </div>
      </div>
    `;
    card.querySelectorAll('.sym-tile').forEach(t=>{
      t.addEventListener('click', ()=>{ toggleSet(symState.symptoms, t.dataset.val); renderSymStep(); });
    });
    const cont = document.getElementById('sym-continue');
    if(cont) cont.addEventListener('click', ()=>{ symState.step=2; renderSymStep(); });
  }
  else if(symState.step===2){
    card.innerHTML = `
      ${stepsRowHTML(symSteps,2)}
      <div class="step-body fade-in">
        <div class="q-block">
          <div class="q-title">1. How intense are your symptoms?</div>
          <div class="choice-row">${['Mild','Moderate','Severe'].map(v=>`<div class="choice ${symState.intensity===v?'selected':''}" data-group="intensity" data-val="${v}">${v}</div>`).join('')}</div>
        </div>
        <div class="q-block">
          <div class="q-title">2. How often do you notice this?</div>
          <div class="choice-row">${['Occasionally','Daily','Constantly'].map(v=>`<div class="choice ${symState.frequency===v?'selected':''}" data-group="frequency" data-val="${v}">${v}</div>`).join('')}</div>
        </div>
        <div class="q-block">
          <div class="q-title">3. When does this usually happen? <span style="font-weight:400;color:var(--ink-500);font-size:11.5px;">Select all that apply.</span></div>
          <div class="choice-row">${['Morning','End of day','Wearing contacts','During screen use','After removing contacts'].map(v=>`<div class="choice ${symState.when.has(v)?'selected':''}" data-group="when" data-val="${v}">${v}</div>`).join('')}</div>
        </div>
        <div class="q-block">
          <div class="q-title">4. How long do you wear your lenses daily?</div>
          <div class="choice-row">${['< 4 hours','4 - 8 hours','8+ hours'].map(v=>`<div class="choice ${symState.wearTime===v?'selected':''}" data-group="wearTime" data-val="${v}">${v}</div>`).join('')}</div>
          <div class="q-title" style="margin-top:12px;">Do you sleep in your contacts?</div>
          <div class="choice-row">${['Yes','No'].map(v=>`<div class="choice ${symState.sleepIn===v?'selected':''}" data-group="sleepIn" data-val="${v}">${v}</div>`).join('')}</div>
        </div>
        <div class="q-block">
          <div class="q-title">5. Any recent changes?</div>
          <div class="choice-row">${['Travel/environmental change','No changes','New lens solution','New brand of lenses'].map(v=>`<div class="choice ${symState.changes.has(v)?'selected':''}" data-group="changes" data-val="${v}">${v}</div>`).join('')}</div>
        </div>
        <div class="q-block">
          <div class="q-title">Anything else you'd like to share?</div>
          <textarea class="freeform" id="sym-notes" placeholder="Optional...">${symState.notes}</textarea>
        </div>
        ${disclaimerHTML()}
        <div class="step-footer">
          <button class="btn btn-ghost" id="sym-back">Back</button>
          <button class="btn btn-primary" id="sym-continue2">Continue</button>
        </div>
      </div>
    `;
    card.querySelectorAll('.choice[data-group]').forEach(c=>{
      c.addEventListener('click', ()=>{
        const g = c.dataset.group, v = c.dataset.val;
        if(g==='when' || g==='changes'){ toggleSet(symState[g], v); }
        else { symState[g] = symState[g]===v ? null : v; }
        renderSymStep();
      });
    });
    document.getElementById('sym-notes').addEventListener('input', e=> symState.notes = e.target.value);
    document.getElementById('sym-back').addEventListener('click', ()=>{ symState.step=1; renderSymStep(); });
    document.getElementById('sym-continue2').addEventListener('click', ()=>{ symState.step=3; renderSymStep(); });
  }
  else if(symState.step===3){
    const topSymptom = [...symState.symptoms][0] || 'Dryness';
    const causeMap = {
      'Dryness': {name:'Dry Eye', sub:'Your responses suggest your symptoms may be related to dry eye.', g:'droplet'},
      'Redness': {name:'Eye Irritation', sub:'Your responses suggest mild irritation, often from lens wear or environment.', g:'eye'},
      'Blurred vision': {name:'Lens Fit Issue', sub:'Your responses suggest your lenses may need a fit or prescription check.', g:'blur'},
    };
    const cause = causeMap[topSymptom] || causeMap['Dryness'];
    const confidence = 72;
    card.innerHTML = `
      ${stepsRowHTML(symSteps,3)}
      <div class="results-grid fade-in">
        <div>
          <div class="q-title" style="margin-bottom:10px;">Your top possible cause:</div>
          <div class="cause-box">
            <div class="glyph">${ic(cause.g)}</div>
            <div><div class="name">${cause.name}</div><div class="sub">${cause.sub}</div></div>
          </div>
        </div>
        <div class="conf-wrap">
          <div class="q-title" style="margin-bottom:10px;">Match confidence</div>
          <div class="conf-ring"><div class="inner">${confidence}%</div></div>
          <div style="font-size:12px;color:var(--blue-700);font-weight:800;">Moderate Match</div>
        </div>
        <div>
          <div class="q-title" style="margin-bottom:10px;">How your symptoms compare:</div>
          <div class="compare-row">You</div>
          <div class="compare-bar"><div class="fill" style="width:82%"></div></div>
          <div class="compare-row">Other users</div>
          <div class="compare-bar"><div class="fill" style="width:46%;background:var(--blue-100);"></div></div>
        </div>
      </div>
      <div class="advice-grid fade-in">
        <div>
          <h3 style="margin-top:0;">What should you do?</h3>
          <div class="advice-item"><div class="glyph">${ic('droplet')}</div><div><div class="t">Hydrate your eyes</div><div class="d">Use preservative-free lubricating drops throughout the day.</div></div></div>
          <div class="advice-item"><div class="glyph">${ic('leaf')}</div><div><div class="t">Lens comfort</div><div class="d">Ensure proper lens care and avoid overwearing your contacts.</div></div></div>
          <div class="advice-item"><div class="glyph">${ic('sun')}</div><div><div class="t">Manage triggers</div><div class="d">Limit screen time and avoid smoky or dry environments.</div></div></div>
          <div class="advice-item"><div class="glyph">${ic('calendar')}</div><div><div class="t">Monitor symptoms</div><div class="d">Track your symptoms to spot patterns and changes over time.</div></div></div>
        </div>
        <div>
          <h3 style="margin-top:0;">Is ${cause.name.toLowerCase()} common?</h3>
          <p class="advice-text"><b>Yes &mdash; ${cause.name.toLowerCase()} is very common</b>, especially among contact lens wearers and people who spend long hours looking at screens.</p>
          <p class="advice-text">It's usually not something to worry about, but if symptoms persist or become uncomfortable, it's a good idea to check in with your eye care provider.</p>
          <span class="link" data-nav="doctor">Contact your doctor</span>
        </div>
      </div>
      <div class="step-body" style="padding-top:0;">
        <div class="step-footer" style="justify-content:space-between;">
          <button class="btn btn-ghost" id="sym-back3">Back</button>
          <button class="btn btn-primary" id="sym-restart">Start over</button>
        </div>
      </div>
    `;
    document.getElementById('sym-back3').addEventListener('click', ()=>{ symState.step=2; renderSymStep(); });
    document.getElementById('sym-restart').addEventListener('click', ()=>{
      symState = { step:1, symptoms:new Set(), intensity:null, frequency:null, when:new Set(), wearTime:null, sleepIn:null, changes:new Set(), notes:'' };
      renderSymStep();
    });
    const docLink = card.querySelector('[data-nav="doctor"]');
    if(docLink) docLink.addEventListener('click', ()=> route('doctor'));
  }
}
